name: core CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fpm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
      - uses: fortran-lang/setup-fpm@v10
        with:
          fpm-version: "0.13.0"
      - name: FPM test
        run: fpm test --profile release
      - name: FPM build
        run: fpm build --profile release
      - name: FPM example
        run: fpm run --profile release
      - name: Diff hygiene
        run: git diff --check
