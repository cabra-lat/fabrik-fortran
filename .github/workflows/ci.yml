name: core CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fpm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: ${{ runner.os == 'macOS' && '12' || 'latest' }}
      - uses: fortran-lang/setup-fpm@v10
        with:
          fpm-version: "v0.13.0"
      - name: FPM test
        run: fpm test --profile release
      - name: FPM build
        run: fpm build --profile release
      - name: FPM example
        run: fpm run --profile release
      - name: Diff hygiene
        run: git diff --check

  sanitizers:
    # FPM cannot inject sanitizer flags, so the C ABI - the contract other
    # languages consume - is built with ASan/UBSan directly and driven by a
    # small C program that covers aliased buffers, null optional pointers and
    # non-finite input.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: latest
      - name: ASan/UBSan C ABI driver
        run: bash ci/sanitize.sh
      - name: Diff hygiene
        run: git diff --check
